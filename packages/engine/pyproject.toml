[project]
name = "spec-agent-kit"
version = "0.4.0"
description = "Engine und CLI (sak) des Spec Agent Kit"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.scripts]
sak = "spec_agent_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_agent_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "SIM", "RUF"]
# JSON-Dokumente sind bewusst dynamisch typisiert.
ignore = ["ANN401"]
