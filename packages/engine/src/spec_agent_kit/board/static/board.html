<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d13; --surface: #12151d; --raised: #1a1e29; --border: #262b38;
    --text: #e7e9ee; --muted: #9aa1b0; --accent: #7c6cf0; --accent2: #22b8cf;
    --danger: #f87171; --success: #4ade80; --warning: #fbbf24;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f7f8fa; --surface: #ffffff; --raised: #f0f1f5; --border: #dde1e8;
      --text: #161920; --muted: #5b6270; --accent: #5b4fd6; --accent2: #0f8ea6;
      --danger: #c0362f; --success: #1f8a4c; --warning: #9a6b04;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1.5rem; padding: 1rem 1.25rem .5rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  .stand { color: var(--muted); font-size: .8125rem; }
  .stand.stale { color: var(--warning); }
  .top { display: grid; grid-template-columns: auto minmax(15rem, 1fr) minmax(15rem, 1.6fr); gap: 1rem; padding: .5rem 1.25rem 1rem; align-items: stretch; }
  .tiles { align-content: start; display: grid; grid-template-columns: repeat(3, minmax(6.5rem, 1fr)); gap: .5rem; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: .625rem; padding: .6rem 1rem; }
  .tile b { display: block; font-size: 1.6rem; line-height: 1.1; }
  .tile span { color: var(--muted); font-size: .8125rem; }
  .tile.warn b { color: var(--warning); }
  .tile.bad b { color: var(--danger); }
  .banner { margin: 0 1.25rem .75rem; padding: .6rem .9rem; border-radius: .5rem; background: var(--raised); border: 1px solid var(--border); }
  .banner.error { border-color: var(--danger); color: var(--danger); }
  .banner ul { margin: 0; padding-left: 1.1rem; }
  .layout { display: grid; grid-template-columns: 1fr; gap: 1rem; padding: 0 1.25rem 1rem; align-items: start; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(8.5rem, 1fr); gap: .75rem; overflow-x: auto; padding-bottom: .5rem; }
  .col { background: var(--surface); border: 1px solid var(--border); border-radius: .625rem; min-height: 6rem; }
  .col h2, .panel h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: .6rem .8rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .col.human { border-color: var(--warning); }
  .cards { padding: .5rem; display: grid; gap: .5rem; }
  .card { background: var(--raised); border: 1px solid var(--border); border-radius: .5rem; padding: .55rem .7rem; }
  .card .num { font-family: var(--mono); font-size: .8125rem; color: var(--accent2); }
  .card .title { display: block; hyphens: auto; font-weight: 600; margin: .1rem 0 .3rem; overflow-wrap: anywhere; }
  .card .reason { display: block; color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
  .card.blocked { border-color: var(--danger); }
  .bar { height: .3rem; background: var(--border); border-radius: .2rem; overflow: hidden; margin-top: .35rem; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .badge { display: inline-block; font-size: .7rem; padding: .05rem .4rem; border-radius: 1rem; border: 1px solid var(--warning); color: var(--warning); margin-left: .3rem; }
  .badge.bad { border-color: var(--danger); color: var(--danger); }
  .panel { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: .625rem; min-width: 0; display: flex; flex-direction: column; }
  .ticker { list-style: none; margin: 0; padding: .6rem .8rem; font-size: .8125rem; display: flex; align-items: stretch; flex: 1; gap: .5rem; overflow-x: auto; scroll-snap-type: x proximity; }
  .ticker li { flex: 0 0 15rem; padding: .45rem .65rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--raised); white-space: normal; overflow-wrap: anywhere; line-height: 1.35; scroll-snap-align: start; }
  .ticker li time { display: block; margin: 0 0 .2rem; font-size: .75rem; }
  .ticker li.empty { flex: 1 1 auto; border: 0; background: none; padding: .1rem 0; }
  @media (max-width: 1100px) { .top { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); } }
  .ticker time { color: var(--muted); font-family: var(--mono); margin-right: .4rem; }
  .ticker .deploy, .ticker .verified { color: var(--success); }
  .empty { color: var(--muted); padding: .6rem .8rem; font-size: .8125rem; }
  details.rest { margin: 0 1.25rem 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: .625rem; padding: .6rem .9rem; }
  details.rest summary { cursor: pointer; color: var(--muted); }
  details.rest ul { columns: 18rem; list-style: none; padding: .5rem 0 0; margin: 0; font-size: .8125rem; }
  details.rest li { break-inside: avoid; padding: .1rem 0; overflow-wrap: anywhere; }
  [title] { cursor: help; }
  .runs .lane { padding: .5rem .8rem; border-top: 1px solid var(--border); }
  .runs .lane:first-of-type { border-top: 0; }
  .runs .row { display: flex; justify-content: space-between; gap: .5rem; font-size: .8125rem; }
  .runs .now { color: var(--success); }
  .verdict-approve { color: var(--success); } .verdict-changes_requested { color: var(--warning); } .verdict-needs_human { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1 id="name">Board</h1>
  <span class="stand" id="stand">lädt …</span>
</header>
<div id="banner" hidden></div>
<div class="top">
  <div class="tiles" id="tiles"></div>
  <section class="panel runs"><h2 id="runs-head">Läufe</h2><div id="runs"></div></section>
  <section class="panel"><h2 id="ticker-head">Commit-Ticker</h2><ul class="ticker" id="ticker" tabindex="0" aria-label="Letzte Commits, horizontal scrollbar"></ul></section>
</div>
<div class="layout">
  <div class="board" id="board" aria-live="polite"></div>
</div>
<details class="rest" id="rest"><summary id="rest-summary"></summary><ul id="rest-list"></ul></details>

<script type="application/json" id="labels">__LABELS__</script>
<script>
"use strict";
// Alle Daten laufen über textContent: Commit-Betreffe und Tasktexte sind Daten, nie Markup.
const POLL_MS = 5000;
const RECENT_DONE = 10;
const STAGES = ["specified", "clarified", "planned", "tasked", "implementing", "implemented", "deployed", "verified"];
const DONE_STAGES = ["implemented", "deployed", "verified"];
const SUPPORTED_SCHEMA = "sak.board/1";

let LABELS = {};
try { LABELS = JSON.parse(document.getElementById("labels").textContent) || {}; } catch (error) { LABELS = {}; }
const label = (level, value) => (LABELS[level] && LABELS[level][value]) || String(value);

const HELP = {
  attention: "Alles, was auf dich wartet: eskalierte Läufe, hängende Läufe, Specs mit Freigabe- oder Klärungsbedarf und offene Betreiber-Aufgaben. Jede Karte nennt die Quelle.",
  tiles: {
    in_progress: "In Arbeit: Specs, bei denen mindestens eine, aber noch nicht alle Tasks erledigt sind.",
    done: "Abgeschlossen: Specs, bei denen alle Tasks erledigt sind (unabhängig vom Deploy).",
    blocked: "Blockiert: Specs mit einem gemeldeten Blocker (kommt nur über Plugins).",
    waiting: "Wartet auf dich: Zahl der Einträge in der ersten Spalte.",
    lead: "Ø Durchlauf: Mittelwert der Tage vom ersten Commit einer Spec bis zu ihrem Abschluss.",
  },
};

let lastGood = null;
let timer = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
const fmtTime = (iso) => {
  const date = iso ? new Date(iso) : null;
  return date && !isNaN(date) ? date.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
};
const pad = (n) => String(n).padStart(3, "0");

function renderTiles(m) {
  const tiles = document.getElementById("tiles");
  tiles.replaceChildren();
  const items = [
    ["in_progress", "In Arbeit", m.in_progress, ""],
    ["done", "Abgeschlossen", m.done, ""],
    ["blocked", "Blockiert", m.blocked, m.blocked ? "bad" : ""],
    ["waiting", "Wartet auf dich", m.waiting, m.waiting ? "warn" : ""],
    ["lead", "Ø Durchlauf", m.mean_lead_time_days === null ? "–" : m.mean_lead_time_days + " Tage", ""],
  ];
  for (const [key, name, value, cls] of items) {
    const tile = el("div", "tile " + cls);
    tile.title = HELP.tiles[key];
    tile.append(el("b", "", String(value)), el("span", "", name));
    tiles.append(tile);
  }
}

function specCard(spec) {
  const card = el("div", "card" + (spec.blocked ? " blocked" : ""));
  const top = el("div");
  top.append(el("span", "num", pad(spec.number)));
  if (spec.blocked) top.append(el("span", "badge bad", "blockiert"));
  if (spec.waiting) top.append(el("span", "badge", label("attention_kind", spec.waiting)));
  card.append(top, el("span", "title", spec.title));
  const n = spec.tasks.done + spec.tasks.open;
  if (n > 0) {
    card.append(el("div", "reason", `${spec.tasks.done}/${n} Tasks`));
    const bar = el("div", "bar");
    const fill = el("i");
    fill.style.width = Math.round((spec.tasks.done / n) * 100) + "%";
    bar.append(fill);
    card.append(bar);
  }
  return card;
}

function renderBoard(doc) {
  const board = document.getElementById("board");
  board.replaceChildren();

  const human = el("div", "col human");
  const head = el("h2");
  head.title = HELP.attention;
  head.append(el("span", "", "Mensch prüft / entscheidet"), el("span", "", String(doc.attention.length)));
  human.append(head);
  const cards = el("div", "cards");
  if (doc.attention.length === 0) cards.append(el("div", "empty", "Nichts wartet auf dich."));
  for (const entry of doc.attention) {
    const card = el("div", "card");
    const top = el("div");
    top.append(el("span", "badge", label("attention_kind", entry.kind)));
    if (entry.spec) top.append(el("span", "num", " " + entry.spec));
    card.append(top, el("span", "reason", entry.reason), el("span", "reason", "Quelle: " + entry.source));
    cards.append(card);
  }
  human.append(cards);
  board.append(human);

  const stamp = (s) => Date.parse(s.updated_at || s.finished_at || s.started_at || "") || 0;
  const newestFirst = (a, b) => stamp(b) - stamp(a) || b.number - a.number;
  const finished = doc.specs.filter((s) => DONE_STAGES.includes(s.stage)).sort(newestFirst);
  const open = doc.specs.filter((s) => !s.descoped && !DONE_STAGES.includes(s.stage));
  const shown = open.concat(finished.slice(0, RECENT_DONE)).sort(newestFirst);
  for (const stage of STAGES) {
    const col = el("div", "col");
    const members = shown.filter((s) => s.stage === stage);
    const h = el("h2");
    h.append(el("span", "", label("stage", stage)), el("span", "", String(members.length)));
    col.append(h);
    const list = el("div", "cards");
    if (members.length === 0) list.append(el("div", "empty", "–"));
    for (const spec of members) list.append(specCard(spec));
    col.append(list);
    board.append(col);
  }

  const rest = doc.specs.filter((s) => !shown.includes(s)).sort(newestFirst);
  document.getElementById("rest").hidden = rest.length === 0;
  document.getElementById("rest-summary").textContent = `Weitere ${rest.length} Specs (fertig oder zurückgestellt)`;
  const list = document.getElementById("rest-list");
  list.replaceChildren();
  for (const spec of rest) {
    list.append(el("li", "", `${pad(spec.number)} ${spec.title}${spec.descoped ? " (zurückgestellt)" : ""}`));
  }
}

function renderTicker(items) {
  const list = document.getElementById("ticker");
  list.replaceChildren();
  if (items.length === 0) list.append(el("li", "empty", "Keine Commits gefunden."));
  for (const item of items) {
    const li = el("li");
    const text = item.text || label("ticker_kind", item.kind);
    li.append(el("time", "", fmtTime(item.ts)), el("span", item.kind, text));
    li.title = text;
    list.append(li);
  }
}

function renderRuns(runs) {
  const box = document.getElementById("runs");
  box.replaceChildren();
  if (runs.length === 0) {
    box.append(el("div", "empty", "Keine Läufe."));
    return;
  }
  const ordered = runs.filter((r) => r.active).concat(runs.filter((r) => !r.active)).slice(0, 4);
  for (const run of ordered) {
    const lane = el("div", "lane");
    const row = el("div", "row");
    const flags = (run.stale ? " · verwaist" : run.idle ? " · inaktiv" : "");
    row.append(el("b", "", run.spec), el("span", run.active ? "now" : "", `${label("run_state", run.state)} · Runde ${run.round}/${run.max_rounds}${flags}`));
    lane.append(row);
    lane.title = run.run_id;
    for (const st of run.stations.slice(-4)) {
      const line = el("div", "row");
      const dur = st.duration_s !== undefined ? " · " + Math.round(st.duration_s) + " s" : "";
      line.append(el("span", st.state === "running" ? "now" : "", `${label("role", st.role)}${st.model ? " (" + st.model + ")" : ""}`),
        el("span", "", `Runde ${st.round}${dur}`));
      lane.append(line);
      if (st.verdict) {
        const v = el("div", "row verdict-" + st.verdict, `${label("verdict", st.verdict)}${st.must_count ? " · " + st.must_count + " Muss" : ""}`);
        lane.append(v);
      }
    }
    for (const esc of run.escalations.filter((e) => e.open)) {
      lane.append(el("div", "row verdict-needs_human", "Mensch prüft: " + esc.reason + (esc.gate ? " (" + label("gate", esc.gate) + ")" : "")));
    }
    box.append(lane);
  }
}

function showBanner(lines, isError) {
  const banner = document.getElementById("banner");
  banner.hidden = lines.length === 0;
  banner.className = "banner" + (isError ? " error" : "");
  banner.replaceChildren();
  if (lines.length === 1) banner.textContent = lines[0];
  else if (lines.length > 1) {
    const list = el("ul");
    for (const line of lines) list.append(el("li", "", line));
    banner.append(list);
  }
}

function render(doc, stale) {
  if (doc.schema !== SUPPORTED_SCHEMA) {
    showBanner(["Format unbekannt (" + doc.schema + "): Seite und Werkzeug passen nicht zusammen."], true);
    return;
  }
  document.title = doc.project.name + " · Board";
  document.getElementById("name").textContent = doc.project.name;
  const stand = document.getElementById("stand");
  stand.textContent = "Stand " + fmtTime(doc.generated_at) + (stale ? " – Server nicht erreichbar, letzter Stand" : "");
  stand.className = "stand" + (stale ? " stale" : "");
  showBanner(stale ? [] : doc.notes, false);
  renderTiles(doc.metrics);
  renderBoard(doc);
  renderTicker(doc.ticker);
  renderRuns(doc.runs);
}

async function poll() {
  if (!document.hidden) {
    try {
      const response = await fetch("/board.json", { cache: "no-store" });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || ("HTTP " + response.status));
      lastGood = body;
      render(body, false);
    } catch (error) {
      if (lastGood) render(lastGood, true);
      else {
        document.getElementById("stand").textContent = "nicht erreichbar";
        showBanner(["Board konnte nicht laden: " + error.message], true);
      }
    }
  }
  timer = setTimeout(poll, POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { clearTimeout(timer); poll(); } });
poll();
</script>
</body>
</html>
